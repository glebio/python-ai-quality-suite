[project]
name = "api-contracts"
version = "0.1.0"
description = "API contract tests with pytest + httpx"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "pydantic>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "external: tests that require access to an external service",
    "smoke: minimal checks of critical API behavior",
]
strict_markers = true

[tool.ruff]
line-length = 100
target-version = "py311"
name: ci

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  api-contracts:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api-contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run ruff
        run: |
          ruff check .

      - name: Run pytest
        run: |
          pytest